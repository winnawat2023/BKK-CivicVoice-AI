<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>BKK CivicVoice AI · ติดตามคำร้อง</title>
  <link rel="stylesheet" href="../tailwind.css">
  <link rel="stylesheet" href="../styles.css">
  <script type="module" src="./tracking.mjs"></script>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">BKK</span><h1>ติดตามคำร้อง</h1></div>
    <p class="muted">BKK CivicVoice AI</p>
  </header>
  <main class="main">
    <p class="notice" id="tracking-status" role="status">กำลังโหลดคำร้อง…</p>
    <form id="tracking-search" class="card card-body grid gap-2" hidden>
      <label for="tracking-ticket">เลขคำร้อง</label>
      <input id="tracking-ticket" name="ticket" type="text" maxlength="28" placeholder="BKK-2026-0001" required>
      <input type="hidden" name="mode" value="internal">
      <input id="tracking-api-base" type="hidden" name="apiBase">
      <button type="submit" class="primary">ตรวจสถานะคำร้อง</button>
    </form>
    <section class="card" id="details" hidden>
      <h2 class="card-title tabular-nums" id="ticket-id"></h2>
      <div class="card-body">
        <p id="issue"></p>
        <p class="muted" id="location"></p>
      </div>
    </section>
    <section class="card" id="progress" hidden>
      <h2 class="card-title">ความคืบหน้า</h2>
      <div class="card-body"><ol class="timeline" id="timeline"></ol></div>
    </section>
    <section class="card" id="evidence" hidden>
      <h2 class="card-title">เพิ่มข้อมูลประกอบ</h2>
      <div class="card-body">
        <p class="muted" id="evidence-status" role="status">รอ API สำหรับบันทึกพิกัดและรูปภาพ</p>
        <div class="actions">
          <button type="button" id="gps" disabled>ปักหมุดจุดเกิดเหตุ</button>
          <button type="button" id="photo" disabled>แนบรูปเพิ่มเติม</button>
        </div>
        <input class="attachment" id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden aria-label="เลือกรูปเพิ่มเติม">
        <img class="attachment-preview" id="photo-preview" alt="รูปตัวอย่างจากเครื่อง" hidden>
        <p class="muted" id="evidence-coordinates" hidden></p>
        <div class="actions">
          <button type="button" class="primary" id="save-gps" hidden>ยืนยันส่งพิกัด</button>
          <button type="button" class="primary" id="save-photo" hidden>ยืนยันส่งรูป</button>
        </div>
        <form class="evidence-map-form" id="map-form" hidden>
          <label for="map-link">ลิงก์แผนที่ของจุดเกิดเหตุ</label>
          <input id="map-link" type="url" inputmode="url" maxlength="2048"
            placeholder="วางลิงก์จาก Google Maps หรือ Apple Maps" required>
          <button type="submit" id="save-map" class="primary">ส่งลิงก์แผนที่</button>
          <a id="saved-map-link" target="_blank" rel="noopener noreferrer" hidden>เปิดแผนที่ที่ส่งแล้ว</a>
        </form>
      </div>
    </section>
    <div class="footer-links"><a href="../">กลับหน้าบริการประชาชน</a></div>
  </main>
</div>
</body>
</html>
